<text class="sm" x="340.0" y="126.0" text-anchor="middle" >full on until 300 ms: silent, firm</text>
<text class="lab" x="685.7" y="110.0" text-anchor="middle" fill="#3c5fa8" >Hold</text>
<text class="sm" x="685.7" y="126.0" text-anchor="middle" >35 % until the note ends (max 2 s)</text>
