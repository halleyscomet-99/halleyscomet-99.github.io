<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d3d4a"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6455d"/>
    </marker>
    <pattern id="keys" width="98" height="50" patternUnits="userSpaceOnUse" x="40" y="700">
      <rect width="98" height="50" fill="#ffffff"/>
      <path d="M14 0V50M28 0V50M42 0V50M56 0V50M70 0V50M84 0V50M98 0V50" stroke="#b9b9c4" stroke-width="1"/>
      <rect x="9" width="9" height="30" fill="#2b2b36"/>
      <rect x="23" width="9" height="30" fill="#2b2b36"/>
      <rect x="51" width="9" height="30" fill="#2b2b36"/>
      <rect x="65" width="9" height="30" fill="#2b2b36"/>
      <rect x="79" width="9" height="30" fill="#2b2b36"/>
    </pattern>
    <style>
      .band { stroke-width: 1.5; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .box { fill: #ffffff; stroke: #4a4a58; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 700; fill: #1f1f2a; text-anchor: middle; }
      .s { font-size: 12.5px; fill: #5a5a68; text-anchor: middle; }
      .w { fill: none; stroke: #3d3d4a; stroke-width: 1.8; marker-end: url(#a); }
      .pw { fill: none; stroke: #d6455d; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#p); }
      .l { font-size: 12px; fill: #3d3d4a; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .lp { font-size: 12px; fill: #d6455d; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
    /* neutrals: text, arrowheads, lines */
    text[fill="#1f1f2a"], path[fill="#1f1f2a"] { fill: #ececf1; }
    [stroke="#1f1f2a"] { stroke: #ececf1; }
    rect[fill="#ffffff"][stroke] { fill: #15151c; }
    text[fill="#3d3d4a"], path[fill="#3d3d4a"] { fill: #b8b8c4; }
    [stroke="#3d3d4a"] { stroke: #b8b8c4; }
    [stroke="#4a4a58"] { stroke: #8a8a98; }
    text[fill="#5a5a68"] { fill: #a8a8b6; }
    [stroke="#5a5a68"] { stroke: #8a8a98; }
    [stroke="#e3e3ea"] { stroke: #2e2e38; }
    [stroke="#c9c9d4"] { stroke: #44444f; }
    /* accent text + strokes (filled bars keep their colour) */
    text[fill="#3c5fa8"] { fill: #8aa6e8; }  [stroke="#3c5fa8"] { stroke: #7d9be0; }
    text[fill="#2f7a45"] { fill: #6fcf8c; }  [stroke="#2f7a45"] { stroke: #5cbf7a; }
    text[fill="#c46a1f"] { fill: #eda062; }  [stroke="#c46a1f"] { stroke: #e8954f; }
    text[fill="#7a56c2"] { fill: #b399ee; }  [stroke="#7a56c2"] { stroke: #a98ae8; }
    text[fill="#a35a1c"] { fill: #e8a868; }  [stroke="#a35a1c"] { stroke: #e0a060; }
    text[fill="#d6455d"], path[fill="#d6455d"] { fill: #f07a8d; }  [stroke="#d6455d"] { stroke: #f07a8d; }
    /* pastel section bands */
    [fill="#eef3ff"] { fill: #161d30; }
    [fill="#fff3ea"] { fill: #2a1e15; }
    [fill="#ecf8ef"] { fill: #14261a; }
    [fill="#fffbe8"] { fill: #282513; }
    [fill="#b9d9c2"] { fill: #3d6b4a; }
    /* class-based styles (declared after so they win, same as light mode) */
    .h, .lab, .t { fill: #ececf1; }
    .cap, .sm, .s { fill: #a8a8b6; }
    .box { fill: #15151c; stroke: #8a8a98; }
    .w { stroke: #b8b8c4; }
    .l { fill: #c4c4cf; stroke: #000000; }
    .lp { fill: #f07a8d; stroke: #000000; }
  }
</style>
  </defs>


  <!-- Web app -->
  <rect class="band" x="16" y="20" width="1068" height="230" rx="12" fill="#eef3ff" stroke="#9fb6e6"/>
  <text class="tag" x="36" y="46" fill="#3c5fa8">PERFORMANCE PLANNING SOFTWARE</text>

  <rect class="box" x="40" y="66" width="225" height="80" rx="8"/>
  <text class="t" x="152" y="94">Song sources</text>
  <text class="s" x="152" y="114">MIDI · MusicXML</text>
  <text class="s" x="152" y="130">humming · chord loops</text>

  <rect class="box" x="305" y="66" width="225" height="80" rx="8"/>
  <text class="t" x="417" y="94">Arrangement</text>
  <text class="s" x="417" y="114">piano style · chords</text>
  <text class="s" x="417" y="130">key · speed · edits</text>

  <rect class="box" x="570" y="66" width="225" height="80" rx="8"/>
  <text class="t" x="682" y="94">Planner</text>
  <text class="s" x="682" y="114">hand positions · fingers</text>
  <text class="s" x="682" y="130">move timing · current</text>

  <rect class="box" x="835" y="66" width="225" height="80" rx="8"/>
  <text class="t" x="947" y="94">Scheduler</text>
  <text class="s" x="947" y="114">speakers and robot</text>
  <text class="s" x="947" y="130">on one clock</text>

  <path class="w" d="M265 106H303"/>
  <path class="w" d="M530 106H568"/>
  <path class="w" d="M795 106H833"/>

  <rect class="box" x="40" y="176" width="225" height="56" rx="8"/>
  <text class="t" x="152" y="200">Microphone</text>
  <text class="s" x="152" y="219">the singer's voice</text>

  <rect class="box" x="570" y="176" width="225" height="56" rx="8"/>
  <text class="t" x="682" y="200">Listen</text>
  <text class="s" x="682" y="219">follows the singer</text>

  <path class="w" d="M265 204H568"/>
  <path class="w" d="M417 204V148"/>
  <text class="l" x="407" y="168" text-anchor="end">humming → notes → chords</text>
  <text class="l" x="482" y="222">live pitch</text>
  <path class="w" d="M795 204H880V148"/>

  <!-- USB link -->
  <path class="w" d="M1000 146V270H682V328"/>
  <text class="l" x="841" y="264" text-anchor="middle">USB serial · timed move and strike commands</text>

  <!-- Controller board -->
  <rect class="band" x="16" y="290" width="1068" height="160" rx="12" fill="#ecf8ef" stroke="#8fcc9f"/>
  <text class="tag" x="36" y="316" fill="#2f7a45">C0nTrollER BOARD</text>

  <rect class="box" x="40" y="330" width="160" height="80" rx="8"/>
  <text class="t" x="120" y="364">12 V supply</text>
  <text class="s" x="120" y="384">5 A</text>

  <rect class="box" x="240" y="330" width="260" height="80" rx="8"/>
  <text class="t" x="370" y="358">Power input</text>
  <text class="s" x="370" y="378">fuse · TVS · polarity guard</text>
  <text class="s" x="370" y="394">12 V rail · 5 V buck</text>

  <rect class="box" x="570" y="330" width="210" height="80" rx="8" fill="#fffbe8"/>
  <text class="t" x="675" y="358">Teensy 4.1 firmware</text>
  <text class="s" x="675" y="378">time-sorted queue</text>
  <text class="s" x="675" y="394">safety limits</text>

  <rect class="box" x="860" y="330" width="200" height="80" rx="8"/>
  <text class="t" x="960" y="364">TMC2209 ×2</text>
  <text class="s" x="960" y="384">stepper drivers · 12 V</text>

  <path class="pw" d="M200 370H238"/>
  <text class="lp" x="219" y="362" text-anchor="middle">12 V</text>
  <path class="pw" d="M500 370H568"/>
  <text class="lp" x="534" y="362" text-anchor="middle">5 V</text>
  <path class="w" d="M780 372H858"/>
  <text class="l" x="820" y="362" text-anchor="middle" style="font-size:10.5px">STEP·DIR·EN</text>

  <!-- Robot hands -->
  <rect class="band" x="16" y="490" width="1068" height="160" rx="12" fill="#fff3ea" stroke="#e9b78c"/>
  <text class="tag" x="36" y="516" fill="#a35a1c">ROBOT PLAYERS ×2</text>

  <rect class="box" x="305" y="530" width="225" height="80" rx="8"/>
  <text class="t" x="417" y="564">Solenoid fingers</text>
  <text class="s" x="417" y="584">13 per hand · 7 white, 6 black</text>

  <rect class="box" x="570" y="530" width="210" height="80" rx="8"/>
  <text class="t" x="675" y="564">PLAyeRs board</text>
  <text class="s" x="675" y="584">PCA9685 · 13 MOSFETs</text>

  <rect class="box" x="860" y="530" width="200" height="80" rx="8"/>
  <text class="t" x="960" y="558">NEMA17 stepper</text>
  <text class="s" x="960" y="578">GT2 belt · carriage</text>
  <text class="s" x="960" y="594">end stop at home</text>

  <path class="w" d="M675 410V528"/>
  <text class="l" x="684" y="476">I²C</text>
  <path class="pw" d="M500 396H540V500H612V528"/>
  <text class="lp" x="532" y="460" text-anchor="end">12 V</text>
  <path class="w" d="M570 570H532"/>
  <path class="w" d="M960 410V528"/>
  <path class="w" d="M900 530V470H760V412"/>
  <text class="l" x="830" y="464" text-anchor="middle">end stop</text>

  <!-- Keyboard -->
  <path class="w" d="M417 610V698"/>
  <text class="l" x="427" y="660">key strikes</text>
  <path class="w" d="M960 610V698"/>
  <text class="l" x="950" y="660" text-anchor="end">translation</text>
  <rect x="40" y="700" width="1020" height="50" fill="url(#keys)" stroke="#4a4a58" stroke-width="1.5"/>
  <rect x="490" y="732" width="120" height="24" rx="12" fill="#2b2b36"/>
  <text x="550" y="749" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Keyboard</text>

  <!-- Legend -->
  <path class="w" d="M40 780H80"/>
  <text x="90" y="784" font-size="12" fill="#3d3d4a">data and signals</text>
  <path class="pw" d="M210 780H250"/>
  <text x="260" y="784" font-size="12" fill="#d6455d">power</text>
</svg>
