<rect x="497.1" y="458" width="377.1" height="16" rx="4" fill="#3c5fa8" fill-opacity=".55"/>
<text class="note" x="685.7" y="470.0" text-anchor="middle" >hold current</text>
<text class="sm" x="886.9" y="470.0" text-anchor="start" >all strikes together ≤ 4 A</text>
</svg>
