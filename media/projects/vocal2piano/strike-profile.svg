<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1f2a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6455d"/></marker><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .h { font-size: 18px; font-weight: 700; fill: #1f1f2a; }
  .lab { font-size: 13px; font-weight: 700; fill: #1f1f2a; }
  .cap { font-size: 12px; fill: #5a5a68; }
  .sm { font-size: 11px; fill: #5a5a68; }
  .note { font-size: 11px; font-weight: 600; fill: #ffffff; }
</style></defs>
<rect width="1100" height="500" rx="16" fill="#ffffff"/>
<text class="h" x="40.0" y="46.0" text-anchor="start" >Anatomy of one key strike</text>
<text class="cap" x="40.0" y="68.0" text-anchor="start" >Solenoid duty over one 600 ms note. The firmware shapes every strike the same way.</text>
<line x1="120" y1="390.0" x2="1000" y2="390.0" stroke="#e3e3ea"/>
<text class="sm" x="110.0" y="394.0" text-anchor="end" >0 %</text>
<line x1="120" y1="302.5" x2="1000" y2="302.5" stroke="#e3e3ea"/>
<text class="sm" x="110.0" y="306.5" text-anchor="end" >35 %</text>
<line x1="120" y1="215.0" x2="1000" y2="215.0" stroke="#e3e3ea"/>
<text class="sm" x="110.0" y="219.0" text-anchor="end" >70 %</text>
<line x1="120" y1="140.0" x2="1000" y2="140.0" stroke="#e3e3ea"/>
<text class="sm" x="110.0" y="144.0" text-anchor="end" >100 %</text>
<text class="sm" x="120.0" y="408.0" text-anchor="middle" >0 ms</text>
<text class="sm" x="245.7" y="408.0" text-anchor="middle" >100 ms</text>
<text class="sm" x="371.4" y="408.0" text-anchor="middle" >200 ms</text>
<text class="sm" x="497.1" y="408.0" text-anchor="middle" >300 ms</text>
<text class="sm" x="622.9" y="408.0" text-anchor="middle" >400 ms</text>
<text class="sm" x="748.6" y="408.0" text-anchor="middle" >500 ms</text>
<text class="sm" x="874.3" y="408.0" text-anchor="middle" >600 ms</text>
<text class="sm" x="1000.0" y="408.0" text-anchor="middle" >700 ms</text>
<line x1="120" y1="390" x2="1000" y2="390" stroke="#5a5a68"/>
<rect x="120.0" y="134" width="62.9" height="256" fill="#c46a1f" fill-opacity=".07"/>
<rect x="182.9" y="134" width="314.3" height="256" fill="#d6455d" fill-opacity=".07"/>
<rect x="497.1" y="134" width="377.1" height="256" fill="#3c5fa8" fill-opacity=".07"/>
<path d="M120.0 390.0 V215.0 H182.9 V140.0 H497.1 V302.5 H874.3 V390.0 H1000.0" fill="none" stroke="#1f1f2a" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M120.0 320.0 H182.9" stroke="#c46a1f" stroke-width="2" stroke-dasharray="5 3"/>
<text class="lab" x="151.4" y="110.0" text-anchor="middle" fill="#c46a1f" >Strike</text>
<text class="sm" x="151.4" y="126.0" text-anchor="middle" >50 ms</text>
<text class="lab" x="340.0" y="110.0" text-anchor="middle" fill="#d6455d" >Press</text>
<text class="sm" x="340.0" y="126.0" text-anchor="middle" >full on until 300 ms: silent, firm</text>
<text class="lab" x="685.7" y="110.0" text-anchor="middle" fill="#3c5fa8" >Hold</text>
<text class="sm" x="685.7" y="126.0" text-anchor="middle" >35 % until the note ends (max 2 s)</text>
<text class="sm" x="190.4" y="219.0" text-anchor="start" fill="#c46a1f" >← duty from note velocity</text>
<text class="sm" x="190.4" y="324.0" text-anchor="start" fill="#c46a1f" >← black keys at 40 % of it</text>
<text class="sm" x="880.6" y="345.0" text-anchor="start" fill="#1f1f2a" >release</text>
<rect x="585.1" y="328.5" width="190" height="70" rx="8" fill="#ffffff" stroke="#c9c9d4"/>
<text class="sm" x="595.1" y="343.5" text-anchor="start" >zoom: 1 kHz PWM at 35 %</text>
<path d="M595.1 386.5 V354.5 H607.0 V386.5 H629.1 V354.5 H641.0 V386.5 H663.1 V354.5 H675.0 V386.5 H697.1 V354.5 H709.0 V386.5 H731.1 V354.5 H743.0 V386.5 H765.1" fill="none" stroke="#3c5fa8" stroke-width="1.6"/>
<text class="lab" x="120.0" y="448.0" text-anchor="start" >Current budget counts</text>
<rect x="120.0" y="458" width="377.1" height="16" rx="4" fill="#d6455d" fill-opacity=".8"/>
